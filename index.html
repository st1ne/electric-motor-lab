      <div class="noscript">
        <h1>Electric Motor Lab: Why the Rotor Chases the Field</h1>
        <p>
          An electric car's motor has three coils, 120° apart. Feed them three sine-wave currents,
          each a third of a cycle late, and their magnetic fields add up to a single field that
          turns smoothly around the motor, even though no coil moves. A magnet rotor locks onto
          that field and turns with it. An induction rotor has no magnets: it must always lag
          the field slightly (the slip), because only that lag induces the currents the field can
          pull on.
        </p>
